variables:
  PROJECT: prod
  SERVICE: aegis-web
  IMAGE: $HARBOR_REGISTRY/$PROJECT/$SERVICE
  CLOUDFLARE_ZONE: 10b56b339935259142c223f7ebf28ccc
  # CLOUDFLARE_TOKEN — 仅从 GitLab CI Masked/Protected 变量注入，禁止写入仓库
  ALIYUN_REGION: ap-southeast-1
  SITE_ID: "165220169525472"

stages:
  - build
  - deploy
  - purge

build:
  stage: build
  image: gcr.io/kaniko-project/executor:debug
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat <<EOF > /kaniko/.docker/config.json
      {
        "auths": {
          "$HARBOR_REGISTRY": {
            "username": "$PROD_HARBOR_ROBOT",
            "password": "$PROD_HARBOR_SECRET"
          }
        }
      }
      EOF
  script:
    - cp "$ENV_PROD" "$CI_PROJECT_DIR/.env.production"
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile $CI_PROJECT_DIR/Dockerfile \
        --destination $IMAGE:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  image:
    name: dtzar/helm-kubectl:3.15.2
    entrypoint: ["/bin/sh", "-lc"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "$PROD_CA" | base64 -d > /tmp/ca.crt
    - |
      kubectl --server=$PROD_KB \
              --token=$PROD_TOKEN \
              --certificate-authority=/tmp/ca.crt \
              set image deployment/$SERVICE \
                $SERVICE=$IMAGE:$CI_COMMIT_SHORT_SHA \
                -n prod
    - |
      kubectl --server=$PROD_KB \
              --token=$PROD_TOKEN \
              --certificate-authority=/tmp/ca.crt \
              rollout status deployment/$SERVICE -n prod

purge_ali:
  stage: purge
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache curl tar bash jq
    - curl -L https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
    - tar -xzf /tmp/aliyun.tgz -C /usr/local/bin
    - chmod +x /usr/local/bin/aliyun
    - export ALIBABA_CLOUD_ACCESS_KEY_ID="$ALIYUN_ACCESS_KEY_ID"
    - export ALIBABA_CLOUD_ACCESS_KEY_SECRET="$ALIYUN_ACCESS_KEY_SECRET"
    - export ALIBABA_CLOUD_REGION_ID="$ALIYUN_REGION"
  script:
    - echo "等待60秒，确保新版本已对外可见..."
    - sleep 30
    - echo "第1次清除 Aliyun 缓存..."
    - aliyun esa PurgeCaches --region "$ALIYUN_REGION" --SiteId "$SITE_ID" --Type purgeall --Content '{"PurgeAll":true}' --EdgeComputePurge true --Force true
    - sleep 30
    - echo "第2次清除 Aliyun 缓存..."
    - aliyun esa PurgeCaches --region "$ALIYUN_REGION" --SiteId "$SITE_ID" --Type purgeall --Content '{"PurgeAll":true}' --EdgeComputePurge true --Force true
 
purge_cloudflare:
  stage: purge
  image: curlimages/curl:latest
  needs: ["purge_ali"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "等待10秒，确保新版本已对外可见..."
    - sleep 10
    - echo "第1次清除 Cloudflare 缓存..."
    - |
      curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE/purge_cache" \
        -H "Authorization: Bearer $CLOUDFLARE_TOKEN" \
        -H "Content-Type: application/json" \
        --data '{"purge_everything":true}'
    - echo "第2次清除 Cloudflare 缓存..."
    - |
      curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE/purge_cache" \
        -H "Authorization: Bearer $CLOUDFLARE_TOKEN" \
        -H "Content-Type: application/json" \
        --data '{"purge_everything":true}'