# pnpm 11 settings live here (package.json "pnpm" field is ignored).
packages:
  - '.'

overrides:
  '@tanstack/react-query': 5.101.0

# Replaces removed onlyBuiltDependencies / neverBuiltDependencies (pnpm 11).
allowBuilds:
  bufferutil: true
  core-js: true
  keccak: true
  utf-8-validate: true

# Non-interactive installs (CI / agent) may purge node_modules without a TTY.
confirmModulesPurge: false

minimumReleaseAgeExclude:
  - deslop-js@0.9.7
  - oxlint-plugin-react-doctor@0.9.7
  - react-doctor@0.9.7
